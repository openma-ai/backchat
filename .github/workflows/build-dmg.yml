name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: dmg-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Verify tagged release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/verify-release-version.mjs package.json

      - name: Type-check
        run: pnpm run typecheck

      - name: Run curated contract and release-regression tests
        run: pnpm run test:ci

      - name: Run script tests
        run: node --test scripts/*.test.mjs

      - name: Build DMG
        run: |
          pnpm exec electron-vite build
          pnpm run runtime:prepare
          pnpm exec electron-builder --publish never

      - name: Verify packaged runtime imports
        run: |
          app=$(find release -type f -path "*/Backchat.app/Contents/MacOS/Backchat" -print -quit)
          test -n "$app"
          node scripts/verify-packaged-runtime.mjs "$app"

      - name: Verify packaged macOS signature
        run: |
          app=$(find release -type d -name "Backchat.app" -print -quit)
          test -n "$app"
          node scripts/verify-packaged-macos-signature.mjs "$app"

      - name: Verify packaged first prompt
        run: |
          app=$(find release -type f -path "*/Backchat.app/Contents/MacOS/Backchat" -print -quit)
          test -n "$app"
          node scripts/verify-packaged-first-prompt.mjs "$app"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: backchat-macos-dmg
          path: release/**/*.dmg
          if-no-files-found: error

      - name: Publish latest preview download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-preview-release.mjs release

      - name: Upload tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versioned=$(find release -type f -name 'Backchat-*-arm64.dmg' ! -name 'Backchat-arm64.dmg' ! -name 'Backchat-preview-arm64.dmg' -print)
          test -n "$versioned"
          stable="$(dirname "$versioned")/Backchat-arm64.dmg"
          cp "$versioned" "$stable"
          gh release create "${GITHUB_REF_NAME}" "$versioned" "$stable" --generate-notes --verify-tag

      - name: Upload packaged first-prompt screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-first-prompt
          path: test-results/packaged-first-prompt.png
          if-no-files-found: ignore
