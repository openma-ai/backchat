name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run typecheck

      - name: Build DMG
        run: |
          pnpm exec electron-vite build
          pnpm exec electron-builder --publish never

      - name: Smoke-test packaged application
        run: |
          app="release/0.0.1/mac-arm64/Backchat.app/Contents/MacOS/Backchat"
          profile=$(mktemp -d "${RUNNER_TEMP}/backchat-package-smoke-XXXXXX")
          log="${RUNNER_TEMP}/backchat-package-smoke.log"
          "$app" --user-data-dir="$profile" >"$log" 2>&1 &
          app_pid=$!

          for _ in {1..10}; do
            sleep 1
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat "$log"
              exit 1
            fi
          done

          kill "$app_pid" 2>/dev/null || true
          for _ in {1..5}; do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          kill -9 "$app_pid" 2>/dev/null || true
          wait "$app_pid" 2>/dev/null || true
          if grep -E "ERR_MODULE_NOT_FOUND|Uncaught Exception" "$log"; then
            cat "$log"
            exit 1
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: backchat-macos-dmg
          path: release/**/*.dmg
          if-no-files-found: error

      - name: Upload tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/**/*.dmg --generate-notes --verify-tag
