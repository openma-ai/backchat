name: macOS update e2e

# One signed update proof for this branch. It never publishes.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Which update proof to run
        type: choice
        default: stable
        options:
          - stable
          - preview
          - all
      from_tag:
        description: Stable e2e starting release tag
        required: false
        default: v0.0.13
      via_version:
        description: Stable e2e first hop version (x.y.z)
        required: false
        default: "0.0.14"
      to_version:
        description: Stable e2e second hop (empty = hop1 + cache only)
        required: false
        default: ""
      via_release_tag:
        description: Pin hop1 feed when latest is newer than via_version
        required: false
        default: v0.0.14
      require_differential:
        description: Require blockmap differential on hop2
        type: boolean
        required: false
        default: false

concurrency:
  group: macos-update-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    if: github.event.inputs.mode == 'preview' || github.event.inputs.mode == 'all'
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Test the update harness
        run: node --test scripts/macos-update-e2e.test.mjs

      - name: Build two notarized preview versions and install the newer one
        env:
          BACKCHAT_UPDATE_CHANNEL: preview
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "missing ${name}"
              exit 1
            fi
          done
          pnpm exec electron-vite build
          pnpm run runtime:prepare
          BACKCHAT_UPDATE_BUILD=910001 node scripts/run-mac-builder.mjs --mac zip
          BACKCHAT_UPDATE_BUILD=910002 node scripts/run-mac-builder.mjs --mac zip
          node scripts/macos-update-e2e.mjs release

      - name: Upload update evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-update-e2e
          path: |
            test-results/macos-update-e2e.txt
            test-results/backchat-update-evidence.log
            test-results/outside-app.log
            test-results/installed-app.log
          if-no-files-found: ignore

  stable-release-update:
    if: github.event.inputs.mode == 'stable' || github.event.inputs.mode == 'all'
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Test the stable release update harness
        run: node --test scripts/macos-stable-release-update-e2e.test.mjs

      - name: Run stable release update scenario
        env:
          GH_TOKEN: ${{ github.token }}
          BACKCHAT_STABLE_FROM_TAG: ${{ github.event.inputs.from_tag || 'v0.0.13' }}
          BACKCHAT_STABLE_VIA_VERSION: ${{ github.event.inputs.via_version || '0.0.14' }}
          BACKCHAT_STABLE_TO_VERSION: ${{ github.event.inputs.to_version || '' }}
          BACKCHAT_STABLE_VIA_RELEASE_TAG: ${{ github.event.inputs.via_release_tag || 'v0.0.14' }}
          BACKCHAT_STABLE_REQUIRE_DIFFERENTIAL: ${{ github.event.inputs.require_differential || 'false' }}
        run: node scripts/macos-stable-release-update-e2e.mjs

      - name: Upload stable release update evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-stable-release-update-e2e
          path: |
            test-results/macos-stable-release-update-e2e.txt
            test-results/stable-release-hop1.log
            test-results/stable-release-hop1-updater.log
            test-results/stable-release-hop2.log
            test-results/stable-release-hop2-updater.log
            test-results/stable-release-hop2-download.json
            test-results/squirrel-cache-summary.json
            test-results/backchat-update-evidence.log
          if-no-files-found: ignore
