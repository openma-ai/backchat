name: CI heavy

# Post-merge home for the heavy suites. The macOS Electron e2e checks run on
# every code-carrying push to main, on demand on a pull request carrying the
# `full-ci` label, and manually through workflow_dispatch. A failed post-merge
# or dispatched run opens or updates a `ci-failure` issue linking the run and
# the commit.

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
  workflow_dispatch:

concurrency:
  group: ci-heavy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # dorny/paths-filter lists changed files through the Pulls API on pull_request.
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.resolve.outputs.code }}
    steps:
      - name: Check out source
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
        uses: actions/checkout@v7

      - name: Detect code-path changes
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
        id: filter
        uses: dorny/paths-filter@v4
        with:
          # 'some' ignores '!' patterns; 'some-with-excludes' makes a file
          # match only when it hits at least one pattern and no negated one.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            code:
              - "**"
              - "!docs/**"
              - "!src/website/**"
              - "!tsconfig.website.json"
              - "!website.vite.config.ts"
              - "!wrangler.jsonc"
              - "!build/**"
              - "!artifacts/**"
              - "!*.md"
              - "!LICENSE"
              - "!SHOW"

      - name: Resolve the code flag
        id: resolve
        env:
          FILTER_CODE: ${{ steps.filter.outputs.code }}
        run: |
          # No diff context (dispatch, tag push): run everything.
          echo "code=${FILTER_CODE:-true}" >> "$GITHUB_OUTPUT"

  e2e:
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci') ||
      (github.event_name == 'push' && needs.changes.outputs.code == 'true')
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Run fast Electron e2e
        run: pnpm run test:e2e:fast

      - name: Run OpenMA tenant and daemon e2e
        run: pnpm run test:e2e:openma

      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  report-failure:
    name: Report post-merge failure
    needs:
      - changes
      - e2e
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the post-merge failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          WORKFLOW_NAME: ${{ github.workflow }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          label="ci-failure"
          marker="Post-merge CI failure: ${WORKFLOW_NAME}"
          failed=$(printf '%s' "$NEEDS_JSON" | jq -r 'to_entries | map(select(.value.result == "failure") | .key) | join(", ")')
          gh label create "$label" --repo "$REPO" --color d93f0b --description "Post-merge CI failure" --force
          body=$(printf '%s\n' \
            "A post-merge CI run failed." \
            "" \
            "- Run: ${RUN_URL}" \
            "- Commit: ${SHA}" \
            "- Failed jobs: ${failed:-unknown}" \
            "" \
            "This issue updates on every repeat failure; close it once a later main run is green.")
          existing=$(gh issue list --repo "$REPO" --state open --label "$label" --limit 50 --json number,title \
            --jq "[.[] | select(.title | contains(\"${marker}\"))][0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
            echo "updated issue #${existing}"
          else
            gh issue create --repo "$REPO" --title "${marker} @ ${SHA:0:7}" --body "$body" --label "$label"
          fi
