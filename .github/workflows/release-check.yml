# Turns red when a v* tag's generated notes or version pin are wrong.
# It does not block Build macOS DMG: that workflow still publishes on its own.
# After #25 settles, move this check into the DMG publish step so a failure
# stops `gh release create` instead of only failing a parallel job.
name: Release check

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch tags
        run: git fetch --tags --force origin

      - name: Fetch the base branch
        if: github.event_name == 'pull_request'
        run: git fetch --no-recurse-submodules origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check unreleased pull requests and version bump
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          RELEASE_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/release-check.mjs

      - name: Check tag, generated notes, and version pin
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/release-check.mjs --tag
