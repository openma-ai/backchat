name: CI

# Fast path only: dependency review, type-check and unit tests on every change
# that can affect them. The macOS Electron e2e suites moved to ci-heavy.yml —
# they run post-merge on main, on a pull request carrying the `full-ci` label,
# or manually through workflow_dispatch.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # dorny/paths-filter lists changed files through the Pulls API on pull_request.
  pull-requests: read

jobs:
  # Skipped jobs report success, so a docs-only or website-only pull request
  # stays mergeable without burning runner minutes on work it cannot affect.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.resolve.outputs.code }}
    steps:
      - name: Check out source
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
        uses: actions/checkout@v7

      - name: Detect code-path changes
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - "**"
              - "!docs/**"
              - "!src/website/**"
              - "!tsconfig.website.json"
              - "!website.vite.config.ts"
              - "!wrangler.jsonc"
              - "!build/**"
              - "!artifacts/**"
              - "!*.md"
              - "!LICENSE"
              - "!SHOW"

      - name: Resolve the code flag
        id: resolve
        env:
          FILTER_CODE: ${{ steps.filter.outputs.code }}
        run: |
          # No diff context (dispatch, tag push): run everything.
          echo "code=${FILTER_CODE:-true}" >> "$GITHUB_OUTPUT"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5

  unit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Type-check
        run: pnpm run typecheck

      - name: Run curated contract and release-regression tests
        run: pnpm run test:ci

      - name: Run script tests
        run: node --test scripts/*.test.mjs
