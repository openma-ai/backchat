packages:
  - 'packages/*'

# pnpm v11 — allow native build scripts for deps that need them.
# better-sqlite3 needs node-gyp at install; without this its addon
# file is missing and require() throws "Could not locate the bindings
# file" at electron startup. electron-rebuild then rewires it to
# Electron's ABI via the `rebuild` package.json script.
allowBuilds:
  better-sqlite3: true
  electron: true
  electron-winstaller: true
  esbuild: true
  node-pty: true
  workerd: false

minimumReleaseAgeExclude:
  - '@agentclientprotocol/claude-agent-acp@0.64.2'
  - '@agentclientprotocol/codex-acp@1.1.0'
overrides:
  '@openma/common': link:../../../Proj/openma-common
  # Security fixes for electron-builder's plist dependencies; keep each minor line.
  '@xmldom/xmldom@>=0.8.0 <0.8.15': 0.8.15
  '@xmldom/xmldom@>=0.9.0 <0.9.12': 0.9.12
